name: Diário Oficial

on:
  schedule:
    - cron: "0 9 * * *"   # 05:00 em Manaus, todos os dias
  workflow_dispatch:
    inputs:
      desde:
        description: "Reler a partir desta edição (ex.: 2700). Deixe vazio para ler só as novas."
        required: false
      max_edicoes:
        description: "Máximo de edições nesta execução"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r robo/requirements.txt

      - name: Ler o Diário
        env:
          DESDE: ${{ inputs.desde }}
          MAX_EDICOES: ${{ inputs.max_edicoes }}
        run: python robo/diario.py

      - name: Gravar o resultado
        run: |
          git config user.name "robo-do-diario"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diario.json robo/estado.json
          if git diff --staged --quiet; then
            echo "Nada novo."
          else
            git commit -m "Diário: atualização de $(date -u +%d/%m/%Y)"
            git push
          fi
