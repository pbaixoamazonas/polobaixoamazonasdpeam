<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Polo do Baixo Amazonas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa de cabeçalho dividida Garantido | Caprichoso com a costura verde da DPE-AM; conteúdo em abas, cartões só onde há objeto. */
:root{
  --bg:#f5f7f3; --surface:#ffffff; --surface-2:#eef2ec; --ink:#16201a; --muted:#5a685f; --line:#dbe3db;
  --dpe:#0e6b3b; --dpe-soft:#dcefe3;
  --garantido:#c8102e; --garantido-soft:#fbe3e6;
  --caprichoso:#143f9e; --caprichoso-soft:#e2e9fb;
  --estrela:#e2a800;
  --ok:#1f7a45; --alerta:#a35d00; --alerta-soft:#fff1d6; --falta:#b3261e; --falta-soft:#fde4e1;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1411; --surface:#161f1a; --surface-2:#1d2822; --ink:#e8eee9; --muted:#9db0a4; --line:#2a3730;
  --dpe:#47c487; --dpe-soft:#173325;
  --garantido:#ff5a6e; --garantido-soft:#3a1a20;
  --caprichoso:#7aa2ff; --caprichoso-soft:#18233f;
  --estrela:#f2c230;
  --ok:#5fd394; --alerta:#f0b25a; --alerta-soft:#3a2a12; --falta:#ff8a80; --falta-soft:#3d1a18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1411; --surface:#161f1a; --surface-2:#1d2822; --ink:#e8eee9; --muted:#9db0a4; --line:#2a3730;
  --dpe:#47c487; --dpe-soft:#173325;
  --garantido:#ff5a6e; --garantido-soft:#3a1a20;
  --caprichoso:#7aa2ff; --caprichoso-soft:#18233f;
  --estrela:#f2c230;
  --ok:#5fd394; --alerta:#f0b25a; --alerta-soft:#3a2a12; --falta:#ff8a80; --falta-soft:#3d1a18;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#8a0c22}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h2{font-size:30px;font-weight:800;line-height:1.05}
h3{font-size:20px;font-weight:800}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--estrela);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* Cabeçalho: o rio entre os dois bumbás */
.topo{position:relative;color:#fff;background:linear-gradient(100deg,#9e0b25 0%,#c8102e 46%,#0e6b3b 46%,#0e6b3b 48.5%,#143f9e 48.5%,#0b2c74 100%);overflow:hidden}
.topo::after{content:"";position:absolute;inset:auto 0 0;height:6px;background:repeating-linear-gradient(90deg,#c8102e 0 22px,#fff 22px 26px,#143f9e 26px 48px,#fff 48px 52px)}
.topo .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:18px 24px}
.marca{display:flex;gap:14px;align-items:center;min-width:0}
.selo{flex:none;width:52px;height:52px}
.marca h1{font-size:34px;font-weight:900;line-height:.95;text-transform:uppercase}
.marca p{margin:3px 0 0;font-size:13px;opacity:.92}
.acoes-topo{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.pill-demo{background:#fff;color:#8a0c22}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 13px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.2}
.btn:hover{border-color:var(--dpe)}
.btn-pri{background:var(--dpe);border-color:var(--dpe);color:#fff}
:root[data-theme="dark"] .btn-pri{color:#06130c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-pri{color:#06130c}}
.btn-topo{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.btn-topo:hover{background:rgba(255,255,255,.24);border-color:#fff}
.btn-sm{padding:4px 9px;font-size:13px}
.btn-perigo{color:var(--falta)}

/* Abas */
.abas{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.abas .wrap{display:flex;flex-wrap:wrap;gap:0 2px}
@media (max-width:700px){.abas .wrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding-bottom:2px}}
.abas a{flex:none;display:block;padding:13px 14px 11px;color:var(--muted);text-decoration:none;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.abas a:hover{color:var(--ink)}
.abas a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--garantido)}
.abas a:nth-child(even)[aria-current="page"]{border-bottom-color:var(--caprichoso)}

main{padding-block:26px 60px}
.cab-secao{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.cab-secao p{margin:6px 0 0;max-width:62ch;color:var(--muted)}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.aviso-demo{display:flex;gap:10px;align-items:flex-start;background:var(--alerta-soft);border:1px solid color-mix(in srgb,var(--alerta) 35%,transparent);border-radius:10px;padding:10px 14px;margin-bottom:22px;font-size:14px}
.aviso-demo b{color:var(--alerta)}

/* Hoje: defensorias */
.grade-dp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dp{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 15px;display:flex;flex-direction:column;gap:8px;min-width:0}
.dp-topo{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.dp-num{font-family:var(--f-display);font-size:26px;font-weight:900;line-height:1}
.dp-comarca{font-size:13px;color:var(--muted);text-align:right}
.dp-area{font-size:13px;color:var(--muted);margin-top:-4px}
.quem{font-weight:700;font-size:16px;line-height:1.3}
.quem i{font-weight:700}
.estado{align-self:flex-start}
.st-ok{background:var(--dpe-soft);color:var(--ok)}
.st-sub{background:var(--caprichoso-soft);color:var(--caprichoso)}
.st-acum{background:var(--garantido-soft);color:var(--garantido)}
.st-falta{background:var(--falta-soft);color:var(--falta)}
.st-auto{background:var(--alerta-soft);color:var(--alerta)}
.polo-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px;padding:14px 16px;margin-bottom:22px;border-left:4px solid var(--dpe);background:var(--surface);border-radius:0 10px 10px 0}
.polo-info > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.grupo{margin:26px 0 10px;font-size:17px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grupo:first-of-type{margin-top:0}
.dp-regras{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:7px;margin-top:auto}
.bolo{font-family:var(--f-mono);font-size:13px}
.dp small{font-size:12.5px;color:var(--muted)}

.dois{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;margin-top:30px}
@media (max-width:860px){.dois{grid-template-columns:1fr}}
.bloco h3{margin-bottom:10px}
.lista{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lista li{padding:10px 2px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.lista li > div{min-width:0}
.vazio{color:var(--muted);font-style:italic;padding:10px 2px}

/* Tabelas */
.tab-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr:last-child td{border-bottom:none}
td.c-sub{font-style:italic;color:var(--caprichoso)}
td.c-falta{color:var(--falta);font-weight:700}
td.c-hoje,th.c-hoje{background:color-mix(in srgb,var(--estrela) 14%,transparent)}

/* Calendário */
.cal-nav{display:flex;gap:8px;align-items:center}
.cal-titulo{font-family:var(--f-display);font-size:24px;font-weight:800;min-width:9ch;text-align:center;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:6px 8px}
.cal .dia{background:var(--surface);min-height:92px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dia.fora{background:var(--surface-2)}
.cal .dia.fora .n{opacity:.45}
.cal .dia.fds{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.cal .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cal .dia.hoje .n{background:var(--estrela);color:#1a1300;border-radius:999px;padding:0 6px;align-self:flex-start;font-weight:500}
.ev{font-size:11.5px;line-height:1.25;border-radius:4px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border:none;text-align:left;width:100%}
.t-ferias{background:var(--garantido-soft);color:var(--garantido)}
.t-licenca{background:var(--caprichoso-soft);color:var(--caprichoso)}
.t-folga{background:var(--dpe-soft);color:var(--ok)}
.t-viagem{background:var(--alerta-soft);color:var(--alerta)}
.t-remoto{background:var(--surface-2);color:var(--ink);outline:1px dashed var(--line)}
.t-outro{background:var(--surface-2);color:var(--muted)}
@media (max-width:620px){.cal .dia{min-height:58px}.ev{font-size:0;height:7px;padding:0}.cal .dow{font-size:10px;padding:5px 3px}}
.legenda{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}

/* Grade do planejamento */
.grade-plan th,.grade-plan td{font-size:13px;padding:7px 8px}
.grade-plan thead tr:first-child th{text-align:center}
.grade-plan .g-par{background:var(--garantido-soft);color:var(--garantido)}
.grade-plan .g-bar{background:var(--caprichoso-soft);color:var(--caprichoso)}
.grade-plan .g-pla{background:var(--dpe-soft);color:var(--ok)}
.grade-plan tbody th{white-space:nowrap;font-family:var(--f-mono);font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink);background:var(--surface)}
.grade-plan tr.atual td,.grade-plan tr.atual th{background:color-mix(in srgb,var(--estrela) 16%,var(--surface))}
.grade-plan td{min-width:92px}
.nota{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.fonte{font-size:12.5px;color:var(--muted)}
.passos{margin:0;padding-left:20px;display:grid;gap:4px}
.prev{font-size:14px}
.prev ul{margin:6px 0 0;padding-left:18px}
/* Histórico */
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filtros .campo{min-width:150px;flex:1 1 150px}
.filtros select,.filtros input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.remessa{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.sit-vig{background:var(--dpe-soft);color:var(--ok)}
.sit-fut{background:var(--caprichoso-soft);color:var(--caprichoso)}
.sit-enc{background:var(--surface-2);color:var(--muted)}
.origem{font-size:12px;color:var(--muted)}
/* Ajuda */
.ajuda{display:grid;gap:26px;max-width:860px}
.ajuda h3{font-size:24px;margin-bottom:6px}
.ajuda h4{font-size:15px;margin:14px 0 4px}
.ajuda p,.ajuda li{max-width:68ch}
.ajuda ol,.ajuda ul{margin:6px 0 0;padding-left:22px;display:grid;gap:5px}
.ajuda details{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:4px 16px 14px}
.ajuda summary{cursor:pointer;font-family:var(--f-display);font-size:22px;font-weight:800;padding:10px 0 4px}
.ajuda .tecla{font-family:var(--f-mono);font-size:12.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface-2)}
.ajuda .fontes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.ajuda .fontes > div{border-top:3px solid var(--dpe);background:var(--surface);padding:10px 12px;border-radius:0 0 8px 8px}
.ajuda .fontes > div:nth-child(2){border-top-color:var(--caprichoso)}
.ajuda .fontes > div:nth-child(3){border-top-color:var(--garantido)}
.ajuda .fontes > div:nth-child(4){border-top-color:var(--estrela)}
/* Diário */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.busca{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px}
.edicao{border-top:2px solid var(--ink);padding-top:10px;margin-top:22px}
.edicao-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.edicao-cab h3{font-size:22px}
.ato{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.ato .num{font-weight:700}
.ato blockquote{margin:6px 0 0;padding-left:10px;border-left:3px solid var(--line);color:var(--muted);font-size:13.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:2px 6px;margin-right:4px}
.cat-designacao{background:var(--caprichoso-soft);color:var(--caprichoso)}
.cat-substituicao{background:var(--caprichoso-soft);color:var(--caprichoso)}
.cat-afastamento{background:var(--garantido-soft);color:var(--garantido)}
.cat-plantao{background:var(--dpe-soft);color:var(--ok)}
.cat-lotacao{background:var(--alerta-soft);color:var(--alerta)}
.cat-coordenacao{background:var(--surface-2);color:var(--ink)}
.cat-servidores{background:var(--surface-2);color:var(--muted)}
.cat-geral{background:var(--surface-2);color:var(--muted)}
.lancado{font-size:12.5px;color:var(--ok);font-weight:700}

/* Formulários */
dialog{border:none;border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,14,.55)}
.dlg-cab{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--garantido-soft),var(--caprichoso-soft))}
.dlg-corpo{padding:16px 18px;display:grid;gap:12px;max-height:68vh;overflow:auto}
.dlg-pe{padding:12px 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line)}
.campo{display:grid;gap:4px}
.campo label{font-size:13px;font-weight:700}
.campo input,.campo select,.campo textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.linha2{grid-template-columns:1fr}}
.subs{border:1px dashed var(--line);border-radius:10px;padding:10px;display:grid;gap:10px}
.sub-item{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sub-item:last-of-type{border-bottom:none;padding-bottom:0}
.erro{color:var(--falta);font-size:13.5px;font-weight:700;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:50;max-width:calc(100vw - 32px)}

/* Login */
.login{display:grid;place-items:center;padding-block:60px}
.login form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;gap:12px}

@media (prefers-reduced-motion:no-preference){.dp,.ato{transition:border-color .15s}}
</style>
</head>
<body>

<header class="topo">
  <div class="wrap">
    <div class="marca">
      <svg class="selo" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="25" fill="#fff"/>
        <path d="M26 41 C14 33 9 26 9 20 a8 8 0 0 1 17-3 v24z" fill="#c8102e"/>
        <path d="M26 41 V17 a8 8 0 0 1 17 3 c0 6-5 13-17 21z" fill="#143f9e"/>
        <path d="M26 19 l2 5 5 .3-4 3.2 1.4 5-4.4-2.8-4.4 2.8 1.4-5-4-3.2 5-.3z" fill="#e2a800"/>
        <path d="M6 44 q10 -5 20 0 t20 0" fill="none" stroke="#0e6b3b" stroke-width="3"/>
      </svg>
      <div style="min-width:0">
        <h1>Polo do Baixo Amazonas</h1>
        <p>Defensoria Pública do Estado do Amazonas · painel da equipe</p>
      </div>
    </div>
    <div class="acoes-topo">
      <span class="pill pill-demo" id="pill-modo" hidden>Modo demonstração</span>
      <span id="quem-logado" style="font-size:13px"></span>
      <a class="btn btn-topo btn-sm" href="#ajuda">Como funciona</a>
      <button class="btn btn-topo btn-sm" id="btn-login" type="button">Entrar</button>
    </div>
  </div>
</header>

<nav class="abas" aria-label="Seções">
  <div class="wrap" id="abas">
    <a href="#hoje">Designações hoje</a>
    <a href="#afastamentos">Afastamentos dos membros</a>
    <a href="#semana">Designações semanais</a>
    <a href="#equipe">Férias da equipe</a>
    <a href="#plantao">Plantão</a>
    <a href="#historico">Histórico de designações</a>
    <a href="#diario">Diário Oficial</a>
    <a href="#pessoas">Pessoas do polo</a>
  </div>
</nav>

<main class="wrap" id="conteudo"></main>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
/* =========================================================================
   CONFIGURAÇÃO — Parte 3: colar aqui o objeto de configuração do Firebase.
   Enquanto for null, o site roda em modo demonstração (dados de exemplo,
   gravados só neste navegador).
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBdW5UmZ4j9p5FcI4p32A-NVeG-DEFX4-4",
  authDomain: "polobaixoasdpeam.firebaseapp.com",
  projectId: "polobaixoasdpeam",
  storageBucket: "polobaixoasdpeam.firebasestorage.app",
  messagingSenderId: "507060949479",
  appId: "1:507060949479:web:f6c3b579e614660266ed42"
};

const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const deIso = s => { const [a,m,d] = s.split("-").map(Number); return new Date(a,m-1,d); };
const br = s => s ? s.split("-").reverse().join("/") : "";
const brCurto = s => s ? `${s.slice(8,10)}/${s.slice(5,7)}` : "";
const somaDias = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };

const cobre = (reg, dia) => reg.inicio <= dia && (!reg.fim || reg.fim >= dia);
const sobrepoe = (a1,a2,b1,b2) => a1 <= (b2||"9999") && b1 <= (a2||"9999");
const segunda = d => { const x = new Date(d); const w = (x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; };

function carregarScript(src){ return new Promise((ok,erro)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=erro; document.head.appendChild(s); }); }
async function carregarFirebase(){
  const v = "10.12.2";
  for (const m of ["app","auth","firestore"]) await carregarScript(`https://cdn.jsdelivr.net/npm/firebase@${v}/firebase-${m}-compat.js`);
  firebase.initializeApp(FIREBASE_CONFIG);
  fb = {auth:firebase.auth(), db:firebase.firestore()};
  await new Promise(pronto => {
    let primeira = true;
    fb.auth.onAuthStateChanged(async u => {
      S.user = null; S.admin = false; S.semCadastro = false; S.naoVerificado = false;
      if (u){
        const email = (u.email||"").toLowerCase();
        if (!u.emailVerified && !ADMINS_INICIAIS.includes(email)){
          let liberado = false;
          try { const d = await fb.db.collection("pessoas").doc(email).get(); liberado = d.exists && d.data().uid === u.uid; } catch(e){}
          if (!liberado){ S.user = {email, uid:u.uid, nome:email}; S.naoVerificado = true; render(); if (primeira){ primeira = false; pronto(); } return; }
        }
        S.user = {email, uid:u.uid, nome:email};
        let p = null;
        try { const d = await fb.db.collection("pessoas").doc(email).get(); if (d.exists) p = d.data(); } catch(e){}
        const inicial = ADMINS_INICIAIS.includes(email);
        if (!p && !inicial){ S.semCadastro = true; render(); if (primeira){ primeira = false; pronto(); } return; }
        S.user.nome = p?.nome || email;
        S.admin = inicial || p?.perfil === "admin";
        S.trocarSenha = !!p?.trocarSenha;
        for (const c of COLECOES) fb.db.collection(c).onSnapshot(q => {
          S[c] = q.docs.map(d=>({id:d.id, ...d.data()}));
          if (c === "pessoas"){ const eu = S.pessoas.find(x => x.id === email); S.admin = inicial || eu?.perfil === "admin"; if (eu) S.user.nome = eu.nome; }
          render();
        }, e => console.warn(c, e));
        if (S.admin) fb.db.collection("pedidos").onSnapshot(q => { S.pedidos = q.docs.map(d=>({id:d.id, ...d.data()})); render(); }, () => {});
        fb.db.collection("diario_lancados").onSnapshot(q => { const st = Object.fromEntries(q.docs.map(d=>[d.id, d.data().status||"lancado"])); for (const ed of S.diario) for (const a of ed.atos){ a.lancado = st[a.id]==="lancado"; a.rejeitado = st[a.id]==="rejeitado"; } render(); });
      }
      render();
      if (primeira){ primeira = false; pronto(); }
    });
  });
}

/* ---------- regras: quem responde por cada DP ---------- */
const dpPorId = id => S.defensorias.find(d=>d.id===id);
const nomeDp = id => { const d = dpPorId(id); return d ? `${d.nome} · ${d.comarca}` : id; };
function autoDoDiario(){
  const out = {desig:[], af:[]};
  for (const ed of S.diario) for (const a of ed.atos){
    if (!a.auto || a.lancado || a.rejeitado || !a.sugestao) continue;
    const s = a.sugestao;
    if (s.tipo === "designacao" && s.dp && s.defensor && s.inicio) out.desig.push({id:"do-"+a.id, dp:s.dp, defensor:s.defensor, inicio:s.inicio, fim:s.fim||"", motivo:a.resumo.slice(0,120), portaria:a.numero, auto:true, edicao:ed.edicao});
    if (s.tipo === "afastamento" && s.defensor && s.inicio && s.fim) out.af.push({id:"do-"+a.id, defensor:s.defensor, tipo:s.afastamento||"ferias", inicio:s.inicio, fim:s.fim, obs:a.resumo, portaria:a.numero, auto:true, edicao:ed.edicao});
  }
  return out;
}
const mesmoPeriodo = (x,d) => x.defensor===d.defensor && x.inicio===d.inicio && (x.fim||"")===(d.fim||"");
const desigs = () => { const au = autoDoDiario().desig.filter(d => !S.designacoes.some(x => x.dp===d.dp && mesmoPeriodo(x,d))); return S.designacoes.concat(au); };
const afs = () => { const au = autoDoDiario().af.filter(d => !S.afastamentos.some(x => mesmoPeriodo(x,d))); return S.afastamentos.concat(au); };
function afastamentoDe(nome, dia){ return nome ? afs().find(a => a.defensor===nome && a.tipo!=="remoto" && cobre(a,dia)) : null; }
function disponivelNa(dpId, dia){
  const d = dpPorId(dpId); if (!d) return null;
  const desig = desigs().filter(g => g.dp===dpId && cobre(g,dia)).sort((a,b)=>b.inicio.localeCompare(a.inicio))[0];
  if (desig && !afastamentoDe(desig.defensor,dia)) return desig.defensor;
  if (d.titular && !afastamentoDe(d.titular,dia)) return d.titular;
  return null;
}
function quemResponde(dp, dia){
  const lista = desigs().filter(g => g.dp===dp.id && cobre(g,dia)).sort((a,b)=>b.inicio.localeCompare(a.inicio));
  const af = afastamentoDe(dp.titular, dia);
  const desig = lista.find(g => !afastamentoDe(g.defensor, dia) && !(g.defensor===dp.titular && af));
  if (desig){
    if (desig.defensor===dp.titular) return {nome:dp.titular, tipo:"ok"};
    return {nome:desig.defensor, tipo: dp.titular ? "sub" : "acum", desig, af};
  }
  const desigAfastado = lista.find(g => g.defensor!==dp.titular);
  if (dp.titular && !af) return {nome:dp.titular, tipo:"ok"};
  let motivo = dp.titular ? `${dp.titular} em ${TIPOS_AF[af.tipo].toLowerCase()}` : "Defensoria sem titular";
  if (desigAfastado) motivo += `; ${desigAfastado.defensor}, designado(a), também está afastado(a)`;
  for (const [i,sub] of (dp.subs||[]).entries()){
    const n = disponivelNa(sub, dia);
    if (n) return {nome:n, tipo:"auto", via:sub, ordemSub:i+1, motivo, af};
  }
  return {nome:"", tipo:"falta", af, motivo:`${motivo}, sem designação e sem substituto automático disponível`};
}
const DIAS_REMESSA = 3; // remessas do Projudi: 3 dias corridos antes do início da designação
const inicioRemessas = d => iso(somaDias(deIso(d), -DIAS_REMESSA));
function proximaDesignacao(g){
  if (!g.fim) return null;
  const dia1 = iso(somaDias(deIso(g.fim), 1));
  return desigs().filter(x => x.dp === g.dp && x.defensor !== g.defensor && x.inicio > g.inicio && x.inicio <= dia1)
    .sort((a,b) => a.inicio.localeCompare(b.inicio))[0] || null;
}
function periodoRemessas(g){
  const prox = proximaDesignacao(g);
  return {inicio: inicioRemessas(g.inicio), fim: prox ? iso(somaDias(deIso(inicioRemessas(prox.inicio)), -1)) : (g.fim || ""), prox};
}
function quemRecebeRemessas(dp, dia){
  const cand = desigs().filter(g => g.dp === dp.id).map(g => ({g, r: periodoRemessas(g)})).filter(({r}) => r.inicio <= dia && (!r.fim || r.fim >= dia))
    .sort((a,b) => b.g.inicio.localeCompare(a.g.inicio))[0];
  return cand ? {nome: cand.g.defensor, desig: cand.g} : {nome: quemResponde(dp, dia).nome};
}

/* HTML colado → lista de tabelas, cada uma uma grade de textos (rowspan/colspan expandidos) */
function textoCelula(td){
  const c = td.cloneNode(true);
  c.querySelectorAll("br").forEach(b => b.replaceWith("\n"));
  const blocos = c.querySelectorAll("p,li");
  const linhas = blocos.length ? [...blocos].map(p => p.textContent) : [c.textContent];
  return linhas.flatMap(l => l.split("\n")).map(l => l.replace(/[ \t\u00a0]+/g, " ").trim()).filter(Boolean).join("\n");
}
function tabelasDeHTML(html){
  const doc = new DOMParser().parseFromString(html, "text/html");
  const tabelas = [];
  for (const t of doc.querySelectorAll("table")){
    if (t.parentElement?.closest("table")) continue;
    const grade = [];
    [...t.rows].forEach((tr, r) => {
      grade[r] ||= []; let c = 0;
      for (const td of tr.cells){
        while (grade[r][c] !== undefined) c++;
        const txt = textoCelula(td), rs = Math.max(1, +td.rowSpan || 1), cs = Math.max(1, +td.colSpan || 1);
        for (let i = 0; i < rs; i++){ grade[r+i] ||= []; for (let j = 0; j < cs; j++) grade[r+i][c+j] = txt; }
        c += cs;
      }
    });
    tabelas.push(grade.map(l => Array.from(l, x => x ?? "")));
  }
  return {tabelas, texto: doc.body?.textContent || ""};
}

/* "5, 6, 13-16, 20/10/2026", "26 e 27/10", "14 a 23/09", "24/08/2026 - 02/09/2026" → [{inicio, fim}] */
const MESES_N = {janeiro:1,fevereiro:2,marco:3,abril:4,maio:5,junho:6,julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12};
function periodos(txt, ano){
  let t = " " + norm(txt).replace(/\n/g, " ") + " ";
  const Y = y => !y ? ano : (y.length === 2 ? 2000 + +y : +y);
  const dias = new Set();
  const valida = (d,m) => m >= 1 && m <= 12 && d >= 1 && d <= 31;
  const faixa = (d1,m1,y1,d2,m2,y2) => {
    if (!valida(d1,m1) || !valida(d2,m2)) return;
    let a = new Date(y1,m1-1,d1), b = new Date(y2,m2-1,d2);
    if (b < a) b = new Date(y2+1,m2-1,d2);
    if ((b - a) / 864e5 > 400) return;
    for (let x = new Date(a); x <= b; x.setDate(x.getDate()+1)) dias.add(iso(x));
  };
  t = t.replace(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*(?:a|ate|-|–)\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/g, (m,d1,m1,y1,d2,m2,y2) => { const y = Y(y2); faixa(+d1,+m1,y1?Y(y1):y,+d2,+m2,y); return " "; });
  t = t.replace(/(\d{1,2})\s*(?:a|ate|-|–)\s*(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/g, (m,d1,d2,mm,y) => { faixa(+d1,+mm,Y(y),+d2,+mm,Y(y)); return " "; });
  t = t.replace(/\b(janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro) de (\d{4})\b/g, (m,mes,y) => { const n = MESES_N[mes]; faixa(1,n,+y,new Date(+y,n,0).getDate(),n,+y); return " "; });
  const re = /(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/g; let ult = 0, m;
  while ((m = re.exec(t))){
    const mm = +m[2], yy = Y(m[3]);
    const cauda = t.slice(ult, m.index).match(/((?:\d{1,2}\s*(?:-\s*\d{1,2})?\s*(?:,|\be\b)\s*)+)$/);
    if (cauda) for (const p of cauda[1].split(/,|\be\b/)){
      const r = p.trim().match(/^(\d{1,2})(?:\s*-\s*(\d{1,2}))?$/);
      if (r) for (let d = +r[1]; d <= (r[2] ? +r[2] : +r[1]); d++) if (valida(d,mm)) dias.add(iso(new Date(yy,mm-1,d)));
    }
    if (valida(+m[1],mm)) dias.add(iso(new Date(yy,mm-1,+m[1])));
    ult = re.lastIndex;
  }
  const segs = [];
  for (const d of [...dias].sort()){ const u = segs[segs.length-1]; if (u && iso(somaDias(deIso(u.fim),1)) === d) u.fim = d; else segs.push({inicio:d, fim:d}); }
  return segs;
}
const diasDe = segs => segs.flatMap(s => { const out = []; for (let x = deIso(s.inicio); iso(x) <= s.fim; x = somaDias(x,1)) out.push(iso(x)); return out; });
const segsDeDias = lista => { const segs = []; for (const d of [...new Set(lista)].sort()){ const u = segs[segs.length-1]; if (u && iso(somaDias(deIso(u.fim),1)) === d) u.fim = d; else segs.push({inicio:d, fim:d}); } return segs; };

/* "RACHEL MARINHO", "Cristiano" → nome completo do cadastro, quando houver */
const naoCadastrados = new Set();
function nomeCompleto(raw){
  const r = norm(raw).replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  if (!r) return String(raw).trim();
  const semH = s => s.replace(/h/g, "");
  const cands = S.pessoas.map(p => ({p, n: norm(p.nome).replace(/[^a-z ]/g, " ").replace(/\s+/g," ")}));
  const toks = r.split(" ").filter(t => !["de","da","do","dos","das","e"].includes(t));
  const c = cands.find(x => x.n === r) || cands.find(x => { const pt = x.n.split(" "); return semH(pt[0]) === semH(toks[0]) && toks.slice(1).every(t => pt.includes(t)); });
  if (c) return c.p.nome;
  const bonito = String(raw).trim().toLowerCase().replace(/(^|\s)(\S)/g, (m,a,b) => a + b.toUpperCase()).replace(/ (De|Da|Do|Dos|Das|E) /g, s => s.toLowerCase());
  naoCadastrados.add(bonito);
  return bonito;
}

const TITULOS_PLAN = [
  ["atribuicoes", /atribuicoes das defensorias/],
  ["designacoes", /designacoes para/],
  ["grade", /atendimentos,? audiencias e plant/],
  ["ferias_def", /ferias, folgas e trabalho remoto/],
  ["ferias_eq", /ferias e folgas de servidores/],
  ["eventos", /eventos e proximas viagens/],
  ["plantoes", /^plantoes$/]
];
const tipoPorTexto = (t, nDias) => { const n = norm(t);
  if (/transito|remoto|teletrabalho/.test(n)) return "remoto";
  if (/licen/.test(n)) return "licenca";
  if (/ferias/.test(n)) return "ferias";
  if (/folga|compensa/.test(n)) return "folga";
  return nDias >= 5 ? "ferias" : "folga"; };

function parseSubs(txt, segsAf, ano){
  const linhas = String(txt).split("\n").map(l => l.trim()).filter(l => l && !/nao cabe|sem substitut/.test(norm(l)));
  const datadas = [], soltas = [];
  for (const l of linhas){
    const dps = [...l.matchAll(/(\d{1,2})\s*[ªaº°]\s*dp/gi)].map(m => "dp" + (+m[1]));
    if (!dps.length) continue;
    const partes = l.split(":");
    let nome = partes.length > 1 ? partes.slice(1).join(":") : l.replace(/.*\d{1,2}\s*[ªaº°]\s*dp/i, "");
    nome = nome.replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g, "").replace(/[-–]/g, " ").trim();
    if (!nome) continue;
    const segs = periodos(partes[0].replace(/\d{1,2}\s*[ªaº°]\s*dp/gi, " "), ano);
    (segs.length ? datadas : soltas).push({dps, nome: nomeCompleto(nome), segs});
  }
  const out = [];
  for (const d of datadas) for (const dp of d.dps) for (const s of d.segs) out.push({dp, defensor:d.nome, ...s});
  for (const d of soltas) for (const dp of d.dps){
    const cobertos = new Set(diasDe(out.filter(o => o.dp === dp)));
    for (const s of segsDeDias(diasDe(segsAf).filter(x => !cobertos.has(x)))) out.push({dp, defensor:d.nome, ...s});
  }
  return out;
}

function interpretarPlanejamento(tabelas, ano){
  naoCadastrados.clear();
  const R = {grade:[], afastamentos:[], designacoes:[], equipe:[], eventos:[], plantao:[], avisos:[], ignorados:{atribuicoes:0, designacoes:0}};
  let secao = null, grupoCols = [], labelCols = [];
  const n = {af:0, dg:0, eq:0, ev:0, pl:0, gr:0};
  for (const tab of tabelas){
    for (const row of tab){
      const cel = row.map(c => String(c ?? "").trim());
      const naoVazias = [...new Set(cel.filter(Boolean))];
      if (!naoVazias.length) continue;
      if (naoVazias.length === 1){
        const t = norm(naoVazias[0]);
        const achou = TITULOS_PLAN.find(([,re]) => re.test(t));
        if (achou){ secao = achou[0]; continue; }
        if (secao === "ferias_def" && MESES_N[t]) continue;
      }
      const c0 = norm(cel[0]).replace(/\n/g, " ");
      if (secao === "atribuicoes"){ R.ignorados.atribuicoes++; continue; }
      if (secao === "designacoes"){ R.ignorados.designacoes++; continue; }
      if (secao === "grade"){
        if (c0 === "semana"){
          if (cel.some(c => /atendimento|audiencia/.test(norm(c)))) labelCols = cel.map(c => c.replace(/\n/g, " "));
          else grupoCols = cel.map(c => c.replace(/\n/g, " "));
          continue;
        }
        const mm = c0.match(/^(\d{1,2})\/(\d{1,2})\s*a\s*(\d{1,2})\/(\d{1,2})/);
        if (!mm) continue;
        const ini = new Date(ano, +mm[2]-1, +mm[1]); let fim = new Date(ano, +mm[4]-1, +mm[3]); if (fim < ini) fim = new Date(ano+1, +mm[4]-1, +mm[3]);
        const cols = [];
        for (let i = 1; i < cel.length; i++){
          const lab = (labelCols[i] || "").trim(), grp = (grupoCols[i] || "").trim();
          if (!lab && !cel[i]) continue;
          const rotulo = lab ? (grp && norm(grp) !== norm(lab) ? `${grp} · ${lab}` : lab) : `Coluna ${i}`;
          cols.push({label: rotulo, texto: cel[i]});
        }
        R.grade.push({id:`pl-gr-${++n.gr}`, inicio:iso(ini), fim:iso(fim), cols});
        continue;
      }
      if (secao === "ferias_def"){
        if (c0 === "defensora" || c0 === "defensor" || c0 === "defensor(a)") continue;
        const [nome, per, subs, obs] = cel;
        if (!nome || !per) continue;
        const segs = periodos(per, ano);
        if (!segs.length){ R.avisos.push(`Não entendi as datas de ${nome}: “${per.replace(/\n/g," ")}”`); continue; }
        const defensor = nomeCompleto(nome), nd = diasDe(segs).length, tipo = tipoPorTexto(per, nd);
        const deduzido = !/transito|remoto|licen|ferias|folga|compensa/.test(norm(per));
        const ids = segs.map(s => {
          const id = `pl-af-${++n.af}`;
          R.afastamentos.push({id, defensor, tipo, ...s, obs: [per.replace(/\n/g," "), deduzido ? "(tipo deduzido pela duração)" : ""].filter(Boolean).join(" "), portaria:(obs||"").replace(/\n/g," · ")});
          return id;
        });
        if (tipo !== "remoto") for (const d of parseSubs(subs||"", segs, ano)){
          const i = segs.findIndex(s => s.inicio <= d.inicio && s.fim >= d.inicio);
          R.designacoes.push({id:`pl-dg-${++n.dg}`, dp:d.dp, defensor:d.defensor, inicio:d.inicio, fim:d.fim, motivo:`${TIPOS_AF[tipo]} de ${defensor}`, portaria:(obs||"").replace(/\n/g," · "), afastamento: ids[Math.max(0,i)]});
        }
        continue;
      }
      if (secao === "ferias_eq"){
        if (c0 === "servidor" || c0 === "servidor(a)") continue;
        const [nome, per] = naoVazias.length >= 2 ? [cel.find(Boolean), cel.filter(Boolean)[1]] : [null,null];
        if (!nome || !per) continue;
        const segs = periodos(per, ano);
        if (!segs.length){ R.avisos.push(`Não entendi as datas de ${nome}: “${per.replace(/\n/g," ")}”`); continue; }
        const servidor = nomeCompleto(nome), tipo = tipoPorTexto(per, diasDe(segs).length);
        for (const s of segs) R.equipe.push({id:`pl-eq-${++n.eq}`, servidor, tipo, ...s, obs:per.replace(/\n/g," ")});
        continue;
      }
      if (secao === "eventos"){
        const [data, membro, desc] = cel;
        if (!desc && !membro) continue;
        const segs = data ? periodos(data, ano) : [];
        R.eventos.push({id:`pl-ev-${++n.ev}`, data:data.replace(/\n/g," "), inicio:segs[0]?.inicio || "", fim:segs[segs.length-1]?.fim || "", membro:(membro||"").replace(/\n/g," "), descricao:(desc||"").replace(/\n/g," ")});
        continue;
      }
      if (secao === "plantoes"){
        if (!/^semana\s*\d+/.test(c0)) continue;
        const segs = periodos(cel[1] || "", ano);
        if (!segs.length){ R.avisos.push(`Plantão sem datas reconhecidas: “${cel[1]}”`); continue; }
        const pega = (s, rot) => { const m = String(s||"").replace(/\n/g," ").match(new RegExp(rot + "\\s*:\\s*(.*?)(?=\\s+[A-Za-zÀ-ú]+\\s*:|$)","i")); return m ? m[1].trim() : ""; };
        const def = pega(cel[2], "nome") || cel[2] || "", contra = pega(cel[2], "contrapresta[cç][aã]o"), ass = pega(cel[3], "nome") || cel[3] || "";
        R.plantao.push({id:`pl-pl-${++n.pl}`, inicio:segs[0].inicio, fim:segs[segs.length-1].fim, defensor:nomeCompleto(def), assessoria:ass ? nomeCompleto(ass) : "", contraprestacao:contra, portaria:""});
        continue;
      }
    }
  }
  // semanas da grade sem linha na tabela de plantões: usa a coluna "Plantão" da grade
  for (const g of R.grade){
    if (R.plantao.some(p => sobrepoe(p.inicio,p.fim,g.inicio,g.fim))) continue;
    const col = g.cols.find(c => /plantao/.test(norm(c.label)));
    if (!col || !col.texto) continue;
    const nomes = col.texto.split(/\n|\/|,| e /).map(s => s.trim()).filter(Boolean);
    R.plantao.push({id:`pl-pl-${++n.pl}`, inicio:g.inicio, fim:g.fim, defensor:nomeCompleto(nomes[0]), assessoria:nomes[1] ? nomeCompleto(nomes[1]) : "", contraprestacao:"", portaria:"", obs:"Da grade semanal"});
  }
  R.naoCadastrados = [...naoCadastrados].sort();
  return R;
}
function anoDoPlanejamento(texto){
  const t = norm(texto);
  const m = t.match(/de (20\d{2})\s*[–-]?\s*\d\s*[ºo°]?\s*trimestre/) || t.match(/trimestre[^0-9]{0,40}(20\d{2})/) || t.match(/\b(20\d{2})\b/);
  return m ? +m[1] : new Date().getFullYear();
}

   Nomes de réus dos júris foram omitidos. */

const chavePlan = (col, o) => ({grade:`g|${o.inicio}`, eventos:`e|${o.data||o.inicio||""}|${norm(o.descricao||"").slice(0,40)}`, afastamentos:`a|${o.defensor}|${o.inicio}`, equipe:`q|${o.servidor}|${o.inicio}`, plantao:`p|${o.inicio}`, designacoes:`d|${o.dp}|${o.defensor}|${o.inicio}`})[col] || `${col}|${o.id}`;
function filtrarPlano(R){
  const out = {};
  const subst = col => new Set((S[col]||[]).filter(x => x.origem !== "planejamento" && x.substitui).map(x => x.substitui));
  let mantidos = 0;
  for (const col of COLS_PLAN){ const sb = subst(col); out[col] = (R[col]||[]).filter(o => !sb.has(chavePlan(col,o))); mantidos += (R[col]||[]).length - out[col].length; }
  const afOk = new Set(out.afastamentos.map(a => a.id));
  out.designacoes = out.designacoes.filter(d => !d.afastamento || afOk.has(d.afastamento))
    .filter(d => !S.designacoes.some(x => x.origem !== "planejamento" && x.dp === d.dp && x.defensor === d.defensor && x.inicio === d.inicio && (x.fim||"") === (d.fim||"")));
  out.mantidos = mantidos;
  return out;
}

    return `<article class="dp"><div class="dp-topo"><span class="dp-num">${esc(dp.nome)}</span><span class="dp-comarca">${esc(dp.comarca)}</span></div><div class="dp-area">${esc(dp.area||"")}</div>${estadoPill(q)}${corpo}${(() => { const r = quemRecebeRemessas(dp, HOJE); return r.nome && r.nome !== q.nome ? `<small style="color:var(--caprichoso)"><b>Remessas do Projudi:</b> já com ${esc(r.nome)}</small>` : ""; })()}<div class="dp-regras">Substitutos: ${(dp.subs||[]).map(curto).join(" e ")||"—"}${dp.colidente?` · colidente: ${curto(dp.colidente)}`:""}</div>${adm(`<div><button class="btn btn-sm" data-acao="editar-dp" data-id="${dp.id}" type="button">Editar</button></div>`)}</article>`;

  <div class="barra">${adm(`<button class="btn" data-acao="nova-dp" type="button">Nova defensoria</button><button class="btn btn-pri" data-acao="nova-desig" type="button">Nova designação</button>`)}</div></div>

  <div class="dois">
    <section class="bloco"><h3>Designações vigentes e próximas</h3>
      <ul class="lista">${vigentes.map(g=>`<li><div><b>${esc(g.defensor)}</b> → ${esc(nomeDp(g.dp))}<br><span class="muted">${esc(g.motivo||"")}${g.portaria?` · ${esc(g.portaria)}`:""}</span></div><div style="text-align:right"><span class="mono">${brCurto(g.inicio)}${g.fim?`–${brCurto(g.fim)}`:"→"}</span>${g.auto ? `<br><span class="fonte">Diário, ed. ${g.edicao}</span>` : adm(`<br><button class="btn btn-sm" data-acao="editar-desig" data-id="${g.id}" type="button">Editar</button>`)}</div></li>`).join("") || `<li class="vazio">Nenhuma designação vigente.</li>`}</ul>

      <h3 style="margin-top:22px">Acumulações hoje</h3>

}

function calendario(mesRef, eventos){
  const ini = new Date(mesRef.getFullYear(), mesRef.getMonth(), 1);
  const cursor = somaDias(ini, -ini.getDay());
  let h = DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  for (let i=0;i<42;i++){
    const dia = somaDias(cursor,i); const s = iso(dia);
    if (i>=35 && dia.getMonth()!==mesRef.getMonth()) break;
    const evs = eventos.filter(e=>cobre(e,s));
    const cls = ["dia", dia.getMonth()!==mesRef.getMonth()?"fora":"", s===HOJE?"hoje":"", (dia.getDay()===0||dia.getDay()===6)?"fds":""].join(" ");
    h += `<div class="${cls}"><span class="n">${dia.getDate()}</span>${evs.map(e=>`<button type="button" class="ev t-${e.tipo}" data-acao="${e._acao}" data-id="${e.id}" title="${esc(e._rot)} · ${TIPOS_AF[e.tipo]} · ${br(e.inicio)} a ${br(e.fim)}">${esc(e._curto)}</button>`).join("")}</div>`;
  }
  return `<div class="cal">${h}</div><div class="legenda">${Object.entries(TIPOS_AF).map(([k,v])=>`<span class="pill t-${k}">${v}</span>`).join("")}</div>`;
}
const primeiroNome = n => (n||"").split(" ")[0];

function gradePlanejamento(){
  const grade = [...S.grade].sort((a,b)=>a.inicio.localeCompare(b.inicio));
  if (!grade.length) return `<p class="vazio">Grade ainda não carregada. ${adm("Use <b>Atualizar pelo planejamento</b> ou <b>Nova semana</b>.")}</p>`;
  const cols = grade[0].cols.map(c => c.label);
  const grupo = l => l.includes(" · ") ? l.split(" · ")[0] : "";
  const rot = l => l.includes(" · ") ? l.split(" · ").slice(1).join(" · ") : l;
  const cls = l => { const n = norm(l); return /plantao/.test(n) ? "g-pla" : /barreirinha/.test(n) ? "g-bar" : "g-par"; };
  let topo = "", i = 0;
  while (i < cols.length){ const g = grupo(cols[i]); let j = i; while (j+1 < cols.length && grupo(cols[j+1]) === g) j++;
    topo += g ? `<th colspan="${j-i+1}" class="${cls(cols[i])}">${bonitoCel(g)}</th>` : `<th rowspan="2" class="${cls(cols[i])}">${bonitoCel(cols[i])}</th>`; i = j+1; }
  const sub = cols.filter(grupo).map(l => `<th class="${cls(l)}">${bonitoCel(rot(l))}</th>`).join("");
  const ref = iso(ui.semana);
  return `<div class="tab-scroll"><table class="grade-plan"><thead><tr><th rowspan="2">Semana</th>${topo}</tr><tr>${sub}</tr></thead><tbody>
    ${grade.map(g => `<tr class="${g.inicio<=ref && g.fim>=ref ? "atual" : ""}"><th scope="row">${brCurto(g.inicio)} a ${brCurto(g.fim)}${g.substitui?'<span class="nota">corrigida à mão</span>':""}${adm(`<br><button class="btn btn-sm" data-acao="editar-semana" data-id="${g.id}" type="button" style="margin-top:4px">Editar</button>`)}</th>${cols.map(l => { const c = g.cols.find(x=>x.label===l); return `<td>${c ? bonitoCel(c.texto) : ""}</td>`; }).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}

const DOMINIO = "@defensoria.am.def.br";
function historicoDesignacoes(){
  const mapa = new Map();
  for (const g of desigs()){
    const k = `${g.dp}|${g.defensor}|${g.inicio}|${g.fim||""}`;
    const origem = g.auto ? `Diário, ed. ${g.edicao}` : g.origem === "planejamento" ? "Planejamento" : String(g.id||"").startsWith("sgi") ? "SGI" : "Lançada no site";
    if (mapa.has(k)){ const x = mapa.get(k); if (!x.origens.includes(origem)) x.origens.push(origem); if (!x.portaria && g.portaria) x.portaria = g.portaria; }
    else mapa.set(k, {...g, origens:[origem]});
  }
  return [...mapa.values()].sort((a,b) => b.inicio.localeCompare(a.inicio) || a.dp.localeCompare(b.dp));
}
function situacao(g){ return g.inicio > HOJE ? "fut" : (g.fim && g.fim < HOJE ? "enc" : "vig"); }

function ligarLogin(){
  const form = document.getElementById("form-login"), out = document.getElementById("l-erro");
  form.querySelectorAll("[data-login]").forEach(a => a.addEventListener("click", ev => { ev.preventDefault(); ui.emailLogin = document.getElementById("l-email").value; ui.modoLogin = a.dataset.login; render(); }));
  form.addEventListener("submit", async ev => {
    ev.preventDefault(); out.style.color = "";
    const modo = ui.modoLogin || "entrar";
    const email = document.getElementById("l-email").value.trim().toLowerCase();
    const senha = document.getElementById("l-senha")?.value || "";
    if (!email.endsWith(DOMINIO)){ out.textContent = `Use o seu e-mail funcional, que termina em ${DOMINIO}.`; return; }
    fb.auth.languageCode = "pt";
    try {
      if (modo === "entrar") await fb.auth.signInWithEmailAndPassword(email, senha);
      else if (modo === "criar"){
        if (senha.length < 8){ out.textContent = "A senha precisa ter pelo menos 8 caracteres."; return; }
        if (senha !== document.getElementById("l-senha2").value){ out.textContent = "As duas senhas não são iguais."; return; }
        const r = await fb.auth.createUserWithEmailAndPassword(email, senha);
        await r.user.sendEmailVerification();
      } else {
        await fb.auth.sendPasswordResetEmail(email);
        out.style.color = "var(--ok)"; out.textContent = `Se ${email} tiver senha cadastrada, chega em instantes um link. Veja também a caixa de spam.`;
      }
    } catch(e){
      const c = e.code || "";
      out.textContent = c.includes("email-already-in-use") ? "Esse e-mail já tem senha. Use “Já tenho senha” ou “Esqueci a senha”."
        : c.includes("weak-password") ? "Senha fraca. Use pelo menos 8 caracteres, misturando letras e números."
        : c.includes("too-many-requests") ? "Muitas tentativas. Espere alguns minutos e tente de novo."
        : c.includes("operation-not-allowed") || c.includes("admin-restricted") ? "O cadastro está fechado no momento. Fale com a coordenação do polo."
        : modo === "entrar" ? "E-mail ou senha incorretos. No primeiro acesso, use “Primeiro acesso”."
        : "Não foi possível concluir. Confira o e-mail e tente de novo.";
    }
  });
}

     <div class="linha2"><div class="campo"><label for="f-cargo">Cargo</label><select id="f-cargo" onchange="if(!${p.id?1:0}){document.getElementById('f-perfil').value=this.value==='defensor'?'admin':'leitor'}">${opcoes(CARGOS,p.cargo||"servidor")}</select></div>${campo("f-niver","Aniversário (dd/mm)",p.aniversario,"text",'placeholder="17/03" inputmode="numeric" maxlength="5"')}</div>
     ${campo("f-lot","Lotação",p.lotacao,"text",'placeholder="Titular da 1ª DP · UDI Barreirinha · atendimento…"')}
     ${campo("f-email","E-mail funcional (login)",p.email,"email",'placeholder="nome@defensoria.am.def.br"')}
     <div class="campo"><label for="f-perfil">Acesso ao site</label><select id="f-perfil">${opcoes(PERFIS,p.perfil||(p.cargo==="defensor"?"admin":"leitor"))}</select></div>`,
    async () => { const email = v("f-email").toLowerCase();
      const o = {nome:v("f-nome"),cargo:v("f-cargo"),aniversario:v("f-niver"),lotacao:v("f-lot"),email,perfil:v("f-perfil")};
      if (!o.nome) return "Preencha o nome.";
      if (o.aniversario && !/^\d{2}\/\d{2}$/.test(o.aniversario)) return "Aniversário no formato dd/mm, por exemplo 17/03.";
      if (email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return "E-mail inválido.";
      if (email && S.pessoas.some(x=>x.email===email && x.id!==p.id)) return "Já existe uma pessoa com esse e-mail.";
      o.id = email || (p.id && !p.id.includes("@") ? p.id : uid());
      if (p.id && p.id!==o.id) await Dados.remover("pessoas",p.id);
      await Dados.salvar("pessoas",o); },
    p.id ? () => Dados.remover("pessoas",p.id) : null);
}
function formDp(dp={}){
  abrir(dp.id?`Editar ${esc(dp.nome)}`:"Nova defensoria",
    `<div class="linha2">${campo("f-nome","Nome (ex.: 4ª DP)",dp.nome)}${campo("f-ordem","Ordem na lista",dp.ordem??S.defensorias.length+1,"number")}</div>
     <div class="linha2"><div class="campo"><label for="f-unid">Unidade</label><select id="f-unid">${opcoes(UNIDADES,dp.unidade||"sede")}</select></div>${campo("f-comarca","Comarca",dp.comarca)}</div>
     ${campo("f-area","Área",dp.area)}<div class="campo"><label for="f-det">Detalhes da atribuição</label><textarea id="f-det" rows="3">${esc(dp.detalhe||"")}</textarea></div>
     <div class="linha2"><div class="campo"><label for="f-s1">1º substituto</label><select id="f-s1"><option value="">—</option>${opDps(dp.subs?.[0])}</select></div><div class="campo"><label for="f-s2">2º substituto</label><select id="f-s2"><option value="">—</option>${opDps(dp.subs?.[1])}</select></div></div>
     <div class="campo"><label for="f-col">Colidente</label><select id="f-col"><option value="">—</option>${opDps(dp.colidente)}</select></div>
     ${campo("f-titular","Titular (em branco se vaga)",dp.titular,"text",'list="dl-def"')}${campo("f-ptit","Portaria da titularidade",dp.portariaTitular)}${datalist()}`,
    async () => { if (!v("f-nome")||!v("f-comarca")) return "Preencha o nome e a comarca.";
      await Dados.salvar("defensorias",{...dp,nome:v("f-nome"),ordem:Number(v("f-ordem"))||0,unidade:v("f-unid"),comarca:v("f-comarca"),area:v("f-area"),detalhe:v("f-det"),subs:[v("f-s1"),v("f-s2")].filter(Boolean),colidente:v("f-col"),titular:v("f-titular"),portariaTitular:v("f-ptit")}); },
    dp.id ? () => Dados.remover("defensorias",dp.id) : null);
}
function formDesig(g={}){
  abrir(g.id?"Editar designação":"Nova designação",
    `<div class="campo"><label for="f-dp">Defensoria</label><select id="f-dp">${opDps(g.dp)}</select></div>
     ${campo("f-def","Defensor(a) designado(a)",g.defensor,"text",'list="dl-def"')}${datalist()}
     <div class="linha2">${campo("f-ini","Início",g.inicio,"date")}${campo("f-fim","Término (em branco se sem prazo)",g.fim,"date")}</div>
     ${campo("f-mot","Motivo",g.motivo,"text",'placeholder="Férias do titular, DP vaga, licença…"')}${campo("f-port","Portaria",g.portaria,"text",'placeholder="Portaria nº …/2026-GSPG"')}`,
    async () => { const o = {...g,dp:v("f-dp"),defensor:v("f-def"),inicio:v("f-ini"),fim:v("f-fim"),motivo:v("f-mot"),portaria:v("f-port")};
      if (!o.dp||!o.defensor||!o.inicio) return "Preencha a defensoria, o defensor e o início.";
      if (o.fim && o.fim<o.inicio) return "O término não pode ser antes do início.";
      const choque = S.designacoes.find(x=>x.id!==o.id && x.dp===o.dp && sobrepoe(x.inicio,x.fim,o.inicio,o.fim));
      if (choque) return `Já existe designação de ${choque.defensor} na ${nomeDp(o.dp)} nesse período (${br(choque.inicio)}${choque.fim?" a "+br(choque.fim):""}).`;
      await Dados.salvar("designacoes",o); },
    g.id ? () => Dados.remover("designacoes",g.id) : null, g.origem==="planejamento" ? "planejamento" : (g.substitui ? "manual-plan" : ""));
}
function linhaSub(s={},i){ return `<div class="sub-item" data-sub="${i}"><div class="campo"><label for="s-dp-${i}">Defensoria</label><select id="s-dp-${i}">${opDps(s.dp)}</select></div>${campo(`s-def-${i}`,"Quem responde",s.defensor,"text",'list="dl-def"')}${campo(`s-ini-${i}`,"De",s.inicio,"date")}${campo(`s-fim-${i}`,"Até",s.fim,"date")}<div style="grid-column:1/-1">${campo(`s-port-${i}`,"Portaria da designação",s.portaria,"text")}</div></div>`; }
function formAf(a={}){
  const subs = a.id ? S.designacoes.filter(g=>g.afastamento===a.id) : (a._subs||[]);
  let n = Math.max(subs.length,1);
  abrir(a.id?"Editar afastamento":"Novo afastamento",
    `${campo("f-def","Membro",a.defensor,"text",'list="dl-def"')}${datalist()}
     <div class="linha2"><div class="campo"><label for="f-tipo">Tipo</label><select id="f-tipo">${opcoes(TIPOS_AF,a.tipo||"ferias")}</select></div>${campo("f-port","Portaria do afastamento",a.portaria)}</div>
     <div class="linha2">${campo("f-ini","Início",a.inicio,"date")}${campo("f-fim","Fim",a.fim,"date")}</div>${campo("f-obs","Observação",a.obs)}
     <div class="subs"><b>Quem responde pelas defensorias</b><span class="muted" style="font-size:13px">Pode deixar em branco e completar quando a portaria sair.</span><div id="subs">${(subs.length?subs:[{}]).map((s,i)=>linhaSub(s,i)).join("")}</div><button class="btn btn-sm" type="button" id="mais-sub">+ outra defensoria ou outro período</button></div>`,
    async () => { const o = {id:a.id,defensor:v("f-def"),tipo:v("f-tipo"),inicio:v("f-ini"),fim:v("f-fim"),obs:v("f-obs"),portaria:v("f-port")};
      if (!o.defensor||!o.inicio||!o.fim) return "Preencha o membro, o início e o fim.";
      if (o.fim<o.inicio) return "O fim não pode ser antes do início.";
      const novos = [];
      for (let i=0;i<n;i++){ const s = {dp:v(`s-dp-${i}`),defensor:v(`s-def-${i}`),inicio:v(`s-ini-${i}`)||o.inicio,fim:v(`s-fim-${i}`)||o.fim,portaria:v(`s-port-${i}`)};
        if (!s.defensor) continue;
        if (s.inicio<o.inicio||s.fim>o.fim) return `A designação de ${s.defensor} precisa ficar dentro do afastamento.`;
        if (novos.some(x=>x.dp===s.dp&&sobrepoe(x.inicio,x.fim,s.inicio,s.fim))) return `Duas pessoas na mesma defensoria no mesmo período (${nomeDp(s.dp)}).`;
        novos.push(s); }
      const salvo = await Dados.salvar("afastamentos",o);
      for (const g of subs.filter(g=>g.id)) await Dados.remover("designacoes",g.id);
      for (const s of novos) await Dados.salvar("designacoes",{...s,motivo:`${TIPOS_AF[o.tipo]} de ${o.defensor}`,afastamento:salvo.id});
      if (a._atoId) await Dados.marcarLancado(a._atoId);
      render(); },
    a.id ? async () => { for (const g of subs) await Dados.remover("designacoes",g.id); await Dados.remover("afastamentos",a.id); } : null, a.origem==="planejamento" ? "planejamento" : (a.substitui ? "manual-plan" : ""));
  document.getElementById("mais-sub").onclick = () => { document.getElementById("subs").insertAdjacentHTML("beforeend", linhaSub({},n)); n++; };
}
function verAf(a){
  if (S.admin) return formAf(a);
  const subs = S.designacoes.filter(g=>g.afastamento===a.id);
  dlgForm.innerHTML = `<div class="dlg-cab"><h3>${esc(a.defensor)}</h3></div><div class="dlg-corpo"><div><span class="pill t-${a.tipo}">${TIPOS_AF[a.tipo]}</span> <span class="mono">${br(a.inicio)} a ${br(a.fim)}</span></div>${a.obs?`<div>${esc(a.obs)}</div>`:""}${a.portaria?`<div class="muted">${esc(a.portaria)}</div>`:""}<div><b>Quem responde</b><ul class="lista">${subs.map(g=>`<li><span>${esc(g.defensor)}</span><span class="muted">${esc(nomeDp(g.dp))}</span></li>`).join("")||`<li class="vazio">A definir</li>`}</ul></div></div><div class="dlg-pe"><button class="btn" value="cancel" type="submit">Fechar</button></div>`;
  dlg.showModal();
}
function formEq(e={}){
  abrir(e.id?"Editar lançamento":"Férias e folgas da equipe",
    `${campo("f-serv","Servidor(a)",e.servidor,"text",'list="dl-eq" placeholder="Nome da pessoa"')}<datalist id="dl-eq">${S.pessoas.filter(p=>p.cargo!=="defensor").map(p=>`<option value="${esc(p.nome)}"></option>`).join("")}</datalist>
     <div class="campo"><label for="f-tipo">Tipo</label><select id="f-tipo">${opcoes(TIPOS_AF,e.tipo||"ferias")}</select></div>
     <div class="linha2">${campo("f-ini","Início",e.inicio,"date")}${campo("f-fim","Fim",e.fim,"date")}</div>${campo("f-obs","Observação",e.obs)}`,
    async () => { const o={...e,servidor:v("f-serv"),tipo:v("f-tipo"),inicio:v("f-ini"),fim:v("f-fim")||v("f-ini"),obs:v("f-obs")};
      if (!o.servidor||!o.inicio) return "Preencha o nome e o início."; if (o.fim<o.inicio) return "O fim não pode ser antes do início.";
      await Dados.salvar("equipe",o); },
    e.id ? () => Dados.remover("equipe",e.id) : null, e.origem==="planejamento" ? "planejamento" : (e.substitui ? "manual-plan" : ""));
}
function formPlantao(p={}){
  abrir(p.id?"Editar plantão":"Novo período de plantão",
    `<div class="linha2">${campo("f-ini","Início",p.inicio,"date")}${campo("f-fim","Fim",p.fim,"date")}</div>
     ${campo("f-def","Defensor(a)",p.defensor,"text",'list="dl-def"')}${datalist()}${campo("f-ass","Assessoria",p.assessoria)}${campo("f-port","Portaria",p.portaria)}`,
    async () => { const o={...p,inicio:v("f-ini"),fim:v("f-fim"),defensor:v("f-def"),assessoria:v("f-ass"),portaria:v("f-port")};
      if (!o.inicio||!o.fim||!o.defensor) return "Preencha o período e o defensor."; if (o.fim<o.inicio) return "O fim não pode ser antes do início.";
      await Dados.salvar("plantao",o); },
    p.id ? () => Dados.remover("plantao",p.id) : null, p.origem==="planejamento" ? "planejamento" : (p.substitui ? "manual-plan" : ""));
}
function formImportar(){
  abrir("Colar escala de plantão",
    `<p class="muted" style="margin:0">Uma linha por semana: <span class="mono">início;fim;defensor;assessoria</span> (datas dd/mm/aaaa). Também aceita colar direto do Excel. O Diário Oficial do site mostra a escala do polo já neste formato.</p>
     <div class="campo"><label for="f-csv">Escala</label><textarea id="f-csv" rows="7" placeholder="03/11/2026;09/11/2026;Nome do defensor;Nome da assessoria"></textarea></div>${campo("f-port","Portaria da escala")}`,
    async () => { const linhas = v("f-csv").split(/\n+/).map(l=>l.split(/;|\t/).map(x=>x.trim())).filter(l=>l.length>=3);
      if (!linhas.length) return "Nenhuma linha reconhecida.";
      const conv = s => { const m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : null; };
      for (const [i,l] of linhas.entries()){ if (!conv(l[0])||!conv(l[1])) return `Linha ${i+1}: data inválida.`; }
      for (const l of linhas) await Dados.salvar("plantao",{inicio:conv(l[0]),fim:conv(l[1]),defensor:l[2],assessoria:l[3]||"",portaria:v("f-port")});
    });
}
function lancar(atoId){
  let ato; for (const ed of S.diario) for (const a of ed.atos) if (a.id===atoId) ato = a;
  if (!ato?.sugestao) return;
  const s = ato.sugestao;
  if (s.tipo==="afastamento") return formAf({defensor:s.defensor,tipo:s.afastamento||"ferias",inicio:s.inicio,fim:s.fim,portaria:ato.numero,_atoId:atoId});
  if (s.tipo==="designacao"){
    formDesig({dp:s.dp,defensor:s.defensor,inicio:s.inicio,fim:s.fim,portaria:ato.numero,motivo:ato.resumo.slice(0,90)});
    const salvar = document.getElementById("f-salvar"); const orig = salvar.onclick;
    salvar.onclick = async () => { await orig(); if (!dlg.open) { await Dados.marcarLancado(atoId); render(); } };
  }
}

/* ---------- eventos ---------- */
function ligar(sec){
  if (sec === "historico"){
    const liga = (id, k, ev="change") => { const el = document.getElementById(id); if (el) el.addEventListener(ev, () => { ui[k] = el.value; const pos = el.selectionStart; render(); if (ev==="input"){ const n = document.getElementById(id); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }); };
    liga("h-def","hDef"); liga("h-dp","hDp"); liga("h-de","hDe"); liga("h-ate","hAte"); liga("h-busca","hBusca","input");
  }
  const b = document.getElementById("busca-diario");
  if (b) b.addEventListener("input", () => { ui.buscaDiario = b.value; const pos = b.selectionStart; render(); const nb = document.getElementById("busca-diario"); nb.focus(); nb.setSelectionRange(pos,pos); });
}
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-acao]"); if (!el) return;
  const {acao, id, k, d} = el.dataset;
  const acha = (c) => S[c].find(x=>x.id===id);
  switch (acao){
    case "nova-dp": return formDp();
    case "editar-dp": return formDp(acha("defensorias"));
    case "nova-desig": return formDesig();
    case "editar-desig": return formDesig(acha("designacoes"));
    case "novo-af": return formAf();
    case "editar-af": return formAf(acha("afastamentos"));
    case "ver-af": { const a = afs().find(x=>x.id===id); return a?.auto ? toast(`Lançado automaticamente pelo Diário (ed. ${a.edicao})`) : verAf(a); }
    case "novo-eq": return formEq();
    case "editar-eq": return S.admin ? formEq(acha("equipe")) : null;
    case "novo-plantao": return formPlantao();
    case "editar-plantao": return formPlantao(acha("plantao"));
    case "importar-plantao": return formImportar();
    case "importar-planejamento": return formPlanejamento();
    case "nova-semana": return formSemana();
    case "editar-semana": return formSemana(acha("grade"));
    case "novo-evento": return formEvento();
    case "editar-evento": return formEvento(acha("eventos"));
    case "carga-inicial": return formCarga();
    case "criar-acesso": return (async () => { const p = acha("pessoas"); toast("Criando acesso…"); mostrarAcessos([{p, ...(await criarAcesso(p))}]); })();
    case "acessos-senha-comum": return formSenhaComum();
    case "msg-acesso": return (async () => { const p = acha("pessoas"); let senha = null; try { const d = await fb.db.collection("acessos").doc(p.email).get(); if (d.exists) senha = d.data().senha; } catch(e){}
      if (senha) return mostrarAcessos([{p, ok:true, senha}]);
      const r = await criarAcesso({...p, uid:""}); mostrarAcessos([{p, ...r}]); })();
    case "mensagens-pendentes": return (async () => { const pend = S.pessoas.filter(p => p.email && p.uid && p.trocarSenha); const out = [];
      for (const p of pend){ let senha = null; try { const d = await fb.db.collection("acessos").doc(p.email).get(); if (d.exists) senha = d.data().senha; } catch(e){}
        if (senha){ out.push({p, ok:true, senha}); continue; }
        const r = await criarAcesso({...p, uid:""});
        out.push(r.ok ? {p, ...r} : {p, ok:false, motivo:"senha provisória não guardada (criada antes desta versão): apague esta conta no Firebase › Authentication › Usuários e toque em “Mensagens de acesso” de novo"}); }
      if (!out.length) return toast("Nenhuma mensagem pendente"); mostrarAcessos(out); })();
    case "criar-acessos": return (async () => { const pend = S.pessoas.filter(p => p.email && !p.uid && !ADMINS_INICIAIS.includes(p.email)); if (!pend.length) return toast("Ninguém pendente"); toast(`Criando ${pend.length} acessos…`); const out = []; for (const p of pend) out.push({p, ...(await criarAcesso(p))}); mostrarAcessos(out); })();
    case "nova-senha": return toast("Para uma senha nova, a pessoa usa “Esqueci a senha”; se o e-mail não chegar, exclua a conta dela em Firebase › Authentication e use “Criar acesso”.");
    case "liberar": return (async () => { const r = S.pedidos.find(x => x.id === id); const p = S.pessoas.find(x => x.id === r?.email); if (!r || !p) return;
      await Dados.salvar("pessoas", {...p, uid: r.id}); await fb.db.collection("pedidos").doc(r.id).delete(); toast(`Acesso liberado para ${p.nome}`); })();
    case "recusar": return fb.db.collection("pedidos").doc(id).delete().then(() => toast("Pedido recusado"));
    case "editar-polo": return formPolo();
    case "nova-pessoa": return formPessoa();
    case "editar-pessoa": return formPessoa(acha("pessoas"));
    case "carregar-res13": return (async () => { for (const dp of RES13) await Dados.salvar("defensorias",{...dp,titular:""}); toast("12 defensorias carregadas. Agora informe os titulares."); render(); })();
    case "lancar": return lancar(id);
    case "rejeitar": return Dados.marcarLancado(id,"rejeitado").then(()=>{ toast("Desfeito: o ato não vale mais no site"); render(); });
    case "reaplicar": return Dados.marcarLancado(id,"").then(()=>{ render(); });
    case "cat": ui.catDiario = k; return render();
    case "hsit": ui.hSit = k; return render();
    case "mes": { const m = Number(d); ui[k] = m===0 ? new Date() : new Date(ui[k].getFullYear(), ui[k].getMonth()+m, 1); return render(); }
    case "sem": { const n = Number(d); ui.semana = n===0 ? segunda(new Date()) : somaDias(ui.semana,n); return render(); }
  }
});
document.getElementById("btn-login").addEventListener("click", async () => {
  if (DEMO){ if (S.user){ S.user=null; S.admin=false; } else { S.user={nome:"Admin de teste",email:""}; S.admin=true; } return render(); }
  if (S.user) await fb.auth.signOut(); else location.hash = "#hoje";
});
window.addEventListener("hashchange", () => { render(); window.scrollTo({top:0}); });
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>el.hidden=true, 2200); }

Dados.iniciar().then(render).catch(e => { document.getElementById("conteudo").innerHTML = `<p class="erro">Não foi possível carregar os dados: ${esc(e.message)}</p>`; });
</script>
